# ==============================================================================
# REDIS SENTINEL CONFIGURATION - AUTO FAILOVER ORCHESTRATOR
# Kelompok 6 - Cloud Computing Enterprise Architecture
# ==============================================================================
port 26379
dir /tmp

# Docker DNS Hostname Resolution
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Monitor master Redis dengan nama 'mymaster', IP/host smartcity-redis-primary, port 6379, quorum 1
sentinel monitor mymaster smartcity-redis-primary 6379 1

# Deteksi master tidak merespons setelah 3000ms (3 detik) -> nyatakan ODOWN
sentinel down-after-milliseconds mymaster 3000

# Waktu tunggu proses failover maksimal 10000ms (10 detik)
sentinel failover-timeout mymaster 10000

# Jumlah replica yang disinkronkan secara paralel saat failover
sentinel parallel-syncs mymaster 1
