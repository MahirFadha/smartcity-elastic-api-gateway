# ==============================================================================
# HAPROXY CONFIGURATION - LAYER 4/7 INGRESS LOAD BALANCER
# Kelompok 6 - Cloud Computing Enterprise Architecture
# ==============================================================================
global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# ------------------------------------------------------------------------------
# 1. FRONTEND INGRESS PUBLIK (PORT 80)
# ------------------------------------------------------------------------------
frontend http_front
    bind *:80
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto http
    default_backend kong_cluster

# ------------------------------------------------------------------------------
# 2. BACKEND CLUSTER KONG API GATEWAY (ACTIVE-ACTIVE ROUND-ROBIN)
# ------------------------------------------------------------------------------
backend kong_cluster
    mode http
    balance roundrobin
    option httpchk GET /
    http-check expect rstatus (200|404)
    server kong1 smartcity-gateway-1:8000 check inter 2000ms rise 2 fall 3
    server kong2 smartcity-gateway-2:8000 check inter 2000ms rise 2 fall 3

# ------------------------------------------------------------------------------
# 3. STATS MONITORING DASHBOARD (PORT 8404)
# ------------------------------------------------------------------------------
frontend stats_front
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
