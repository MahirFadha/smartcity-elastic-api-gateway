# ==============================================================================
# JARINGAN TERISOLASI (User-Defined Bridge Network)
# ==============================================================================
networks:
  smartcity-net:
    driver: bridge
    name: smartcity-net

# ==============================================================================
# DEFINISI SERVICES (7 CONTAINERS - HIGH AVAILABILITY CLUSTER)
# ==============================================================================
services:

  # ----------------------------------------------------------------------------
  # 1. API GATEWAY: Kong Gateway (DB-less Mode, Port 80)
  # ----------------------------------------------------------------------------
  api-gateway:
    image: kong:3.4
    container_name: smartcity-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_MEM_CACHE_SIZE: "32m"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "80:8000"       # Ingress Publik (Port 80)
      - "8001:8001"     # Kong Admin API / Diagnostics
    networks:
      - smartcity-net
    depends_on:
      - redis-primary
      - service-kependudukan-1
      - service-kependudukan-2
      - service-pajak-1
      - service-pajak-2
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    cpus: 0.25
    mem_limit: 256m
    restart: on-failure

  # ----------------------------------------------------------------------------
  # 2. STATE STORAGE: Redis Primary (Master)
  # ----------------------------------------------------------------------------
  redis-primary:
    image: redis:7-alpine
    container_name: smartcity-redis-primary
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    networks:
      smartcity-net:
        aliases:
          - redis
          - redis-primary
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    cpus: 0.25
    mem_limit: 256m
    restart: on-failure

  # ----------------------------------------------------------------------------
  # 3. STATE STORAGE: Redis Replica (Slave - Continuous Async Replication)
  # ----------------------------------------------------------------------------
  redis-replica:
    image: redis:7-alpine
    container_name: smartcity-redis-replica
    command: ["redis-server", "--replicaof", "redis-primary", "6379", "--appendonly", "no", "--save", ""]
    networks:
      - smartcity-net
    depends_on:
      - redis-primary
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    cpus: 0.25
    mem_limit: 256m
    restart: on-failure

  # ----------------------------------------------------------------------------
  # 4. MICROSERVICE KEPENDUDUKAN: Worker 1 (Active-Active HA)
  # ----------------------------------------------------------------------------
  service-kependudukan-1:
    build:
      context: ./services/kependudukan
      dockerfile: Dockerfile
    container_name: service-kependudukan-1
    environment:
      - PORT=3000
      - SERVICE_NAME=Service Kependudukan
      - WORKER_ID=Worker 1
      - ARTIFICIAL_DELAY_MS=50
    networks:
      - smartcity-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    cpus: 0.25
    mem_limit: 256m
    restart: on-failure

  # ----------------------------------------------------------------------------
  # 5. MICROSERVICE KEPENDUDUKAN: Worker 2 (Active-Active HA)
  # ----------------------------------------------------------------------------
  service-kependudukan-2:
    build:
      context: ./services/kependudukan
      dockerfile: Dockerfile
    container_name: service-kependudukan-2
    environment:
      - PORT=3000
      - SERVICE_NAME=Service Kependudukan
      - WORKER_ID=Worker 2
      - ARTIFICIAL_DELAY_MS=50
    networks:
      - smartcity-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    cpus: 0.25
    mem_limit: 256m
    restart: on-failure

  # ----------------------------------------------------------------------------
  # 6. MICROSERVICE PAJAK: Worker 1 (Active-Active HA)
  # ----------------------------------------------------------------------------
  service-pajak-1:
    build:
      context: ./services/pajak
      dockerfile: Dockerfile
    container_name: service-pajak-1
    environment:
      - PORT=3000
      - SERVICE_NAME=Service Pajak
      - WORKER_ID=Worker 1
      - ARTIFICIAL_DELAY_MS=100
    networks:
      - smartcity-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    cpus: 0.25
    mem_limit: 256m
    restart: on-failure

  # ----------------------------------------------------------------------------
  # 7. MICROSERVICE PAJAK: Worker 2 (Active-Active HA)
  # ----------------------------------------------------------------------------
  service-pajak-2:
    build:
      context: ./services/pajak
      dockerfile: Dockerfile
    container_name: service-pajak-2
    environment:
      - PORT=3000
      - SERVICE_NAME=Service Pajak
      - WORKER_ID=Worker 2
      - ARTIFICIAL_DELAY_MS=100
    networks:
      - smartcity-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    cpus: 0.25
    mem_limit: 256m
    restart: on-failure
